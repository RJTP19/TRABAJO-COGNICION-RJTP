<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="OVA de ciudadanía digital para grado 6.º con Análisis Cognitivo de Tareas (ACT): seis misiones, cada una con su proceso cognitivo.">
<meta name="theme-color" content="#0a1030">
<title>Ciudadanos digitales: decido con cabeza y corazón</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap">
<style>
:root{--ink:#1d2b5c;--bg:#f6f8fc;--card:#fff;--line:#d5dcec;--teal:#0e8f8f;--sun:#ffc93c;--coral:#e8545a;--okbg:#e2f5ea;--badbg:#fde7e8;--midbg:#fff4d6;--sub:#4a5679;--bd:#1d2b5c;--sk:#c9d4f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8ecff;--bg:#111830;--card:#1b2547;--line:#34406b;--teal:#4fd1c5;--sun:#ffd25e;--coral:#ff8087;--okbg:#17382b;--badbg:#42222a;--midbg:#43391a;--sub:#b3bcdc;--bd:#6577c4;--sk:#0a0f22}}
:root[data-theme="dark"]{--ink:#e8ecff;--bg:#111830;--card:#1b2547;--line:#34406b;--teal:#4fd1c5;--sun:#ffd25e;--coral:#ff8087;--okbg:#17382b;--badbg:#42222a;--midbg:#43391a;--sub:#b3bcdc;--bd:#6577c4;--sk:#0a0f22}
*{box-sizing:border-box}[v-cloak]{display:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) radial-gradient(circle at 1px 1px,var(--line) 1.2px,transparent 0) 0 0/26px 26px;color:var(--ink);font:400 17px/1.6 Nunito,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:"Baloo 2",system-ui,sans-serif;line-height:1.15;margin:0 0 .5rem}
h1{font-size:clamp(1.8rem,6vw,2.8rem);font-weight:800}h2{font-size:1.7rem;font-weight:800}h3{font-size:1.2rem;font-weight:600}
h2::after{content:"";display:block;width:70px;height:7px;border-radius:7px;margin-top:6px;background:linear-gradient(90deg,var(--sun) 60%,var(--coral) 60%);animation:grow .8s .2s both}
p{margin:0 0 .8rem;max-width:68ch}a{color:var(--teal);font-weight:700}
.wrap{max-width:900px;margin:0 auto;padding:0 18px;position:relative}
.blob{position:fixed;z-index:-1;border-radius:50%;opacity:.16;animation:drift 14s ease-in-out infinite;pointer-events:none}
.b1{width:260px;height:260px;background:var(--teal);left:-80px;top:30%}.b2{width:200px;height:200px;background:var(--coral);right:-60px;top:60%;animation-delay:-6s}
header{background:linear-gradient(120deg,#1d2b5c,#2a45a8,#1d6aa8,#1d2b5c);background-size:300% 100%;animation:flow 14s ease infinite;color:#fff;padding:22px 0 0;border-bottom:5px solid var(--sun)}
.brand{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{width:56px;height:56px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:30px;flex:none;box-shadow:0 0 0 4px #ffffff30;animation:bob 4s ease-in-out infinite}
header p{color:#dfe5ff;margin:.3rem 0 0}.tools{margin-left:auto;display:flex;gap:6px}
.tbtn{background:transparent;color:#fff;border:2px solid #fff8;border-radius:999px;padding:6px 14px;font:700 14px Nunito,sans-serif;cursor:pointer;transition:.2s}
.tbtn[aria-pressed="true"]{background:var(--sun);color:#1d2b5c;border-color:var(--sun)}
.badges{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px;color:#dfe5ff;font-weight:700;flex-wrap:wrap}
.badges span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:#ffffff1f;border:2px dashed #ffffff66;filter:grayscale(1);opacity:.55;transition:all .4s}
.badges span.on{filter:none;opacity:1;background:var(--sun);border:2px solid #fff;animation:pop .6s,glow2 2.5s 1s ease-in-out infinite}
.jp{height:6px;background:#ffffff26;border-radius:6px;margin-top:14px;overflow:hidden}.jp i{display:block;height:100%;background:var(--sun);border-radius:6px;transition:width .6s cubic-bezier(.3,1.4,.5,1)}
nav{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-top:4px}
nav button{flex:none;border:0;background:#ffffff1f;color:#fff;padding:10px 16px;border-radius:12px 12px 0 0;font:700 15px Nunito,sans-serif;cursor:pointer;transition:background .2s,transform .3s cubic-bezier(.3,1.6,.5,1)}
nav button:hover{background:#ffffff40;transform:translateY(-3px)}
nav button[aria-selected="true"]{background:var(--bg);color:var(--ink);transform:translateY(3px);padding-bottom:13px}
button:focus-visible,summary:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
main{padding:26px 0 150px;min-height:70vh}
.card,details,.opt{border:2px solid var(--bd);box-shadow:5px 5px 0 var(--sk)}
.card{background:var(--card);border-radius:20px 20px 20px 6px;padding:18px 20px;margin:0 0 16px}
.kw{display:flex;flex-wrap:wrap;gap:8px;padding:0;list-style:none;margin:.5rem 0 0}
.kw li{background:var(--midbg);border:2px solid var(--bd);border-radius:999px;padding:3px 14px;font-weight:700;font-size:15px;transition:transform .2s;animation:pop .5s both}
.kw li:hover{transform:rotate(-3deg) scale(1.08)}
ul.obj{padding-left:1.2rem}ul.obj li{margin-bottom:.5rem}
details{background:var(--card);border-radius:18px;margin:0 0 12px;padding:4px 20px;transition:box-shadow .2s,transform .2s}
details:nth-of-type(1){border-left:10px solid var(--teal)}details:nth-of-type(2){border-left:10px solid var(--coral)}details:nth-of-type(3){border-left:10px solid var(--sun)}
details[open]{box-shadow:7px 7px 0 var(--sk);transform:translate(-1px,-1px)}

summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.6rem;width:34px;height:34px;border-radius:50%;background:var(--sun);color:#1d2b5c;display:grid;place-items:center;transition:transform .3s}
details[open] summary::after{transform:rotate(135deg)}details[open]>*:not(summary){animation:in .4s both}
.tip{border-left:6px solid var(--sun);background:var(--midbg);padding:10px 14px;border-radius:0 12px 12px 0;margin:.6rem 0}
.teacher{display:none;border:2px dashed var(--coral);border-radius:14px;padding:10px 16px;margin:0 0 16px;background:var(--card)}
.teacher::before{content:"Nota para el docente";display:block;font:800 .95rem "Baloo 2",sans-serif;color:var(--coral)}
.t .teacher{display:block;animation:in .4s both}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border-radius:16px;padding:12px 16px;margin:0 0 10px;font:700 16px/1.4 Nunito,sans-serif;cursor:pointer;transition:transform .15s,box-shadow .15s,background .2s}
.opt:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--sk)}.opt:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--sk)}
.opt:disabled{cursor:default}.opt.s2{background:var(--okbg);animation:pop .45s}.opt.s1{background:var(--midbg)}.opt.s0{background:var(--badbg);animation:shake .4s}
.fb{padding:10px 14px;border-radius:12px;margin:0 0 14px;background:var(--midbg);border:2px solid var(--bd)}
.main-btn{position:relative;overflow:hidden;background:var(--sun);color:#1d2b5c;border:2px solid var(--bd);box-shadow:4px 4px 0 var(--bd);border-radius:12px;padding:10px 24px;font:800 16px "Baloo 2",sans-serif;cursor:pointer;transition:transform .15s,box-shadow .15s}
.main-btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--bd)}.main-btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--bd)}
.main-btn+.main-btn{margin-left:10px}
.rp{position:absolute;border-radius:50%;background:#ffffff99;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
.prog{height:16px;border:2px solid var(--bd);border-radius:12px;background:var(--card);overflow:hidden;margin:0 0 14px}
.prog i{display:block;height:100%;background:repeating-linear-gradient(135deg,var(--teal) 0 12px,#13b3b3 12px 24px);background-size:34px 34px;animation:stripe 1s linear infinite;transition:width .5s cubic-bezier(.3,1.3,.5,1)}
.scn{position:relative;background:var(--bg);border:2px solid var(--bd);border-radius:22px 22px 22px 4px;padding:14px 18px 14px 60px;max-width:none;font-size:1.05rem}
.scn::before{content:"📱";position:absolute;left:12px;top:10px;width:38px;height:38px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:20px;animation:ring 3s infinite}
.tabs2{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.tabs2 button{background:var(--card);color:var(--ink);border:2px solid var(--bd);border-radius:999px;padding:6px 16px;font:700 15px Nunito,sans-serif;cursor:pointer;transition:transform .15s,background .2s}
.tabs2 button:hover{transform:translateY(-2px)}.tabs2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
label.chk{display:flex;gap:10px;align-items:flex-start;margin:0 0 8px;cursor:pointer}
label.chk input{width:22px;height:22px;margin-top:3px;accent-color:var(--teal);transition:transform .2s}label.chk input:checked{transform:scale(1.25) rotate(8deg)}
.stars span{display:inline-block;font-size:2rem}
.hero{position:relative;overflow:hidden;border-radius:28px;background:radial-gradient(circle at 85% 20%,#2fb7b0 0,transparent 38%),linear-gradient(135deg,#1d2b5c,#2a45a8);color:#fff;padding:30px 26px 150px;margin:0 0 24px;border:2px solid var(--bd);box-shadow:6px 6px 0 var(--sk)}
.hero h2{font-size:clamp(2rem,7vw,3.3rem);color:#fff;max-width:11ch}.hero h2::after{background:var(--sun)}.hero p{color:#e3e8ff;font-size:1.1rem}
.trail{position:absolute;left:0;bottom:0;width:100%;height:150px}
.dash{fill:none;stroke:#ffffff55;stroke-width:3;stroke-dasharray:3 12;stroke-linecap:round;animation:march 1.4s linear infinite}
.fp{fill:var(--sun);opacity:0;transform-box:fill-box;transform-origin:center;animation:step .5s var(--d) both}
.fp.last{animation:step .5s var(--d) both,glow 2s 2.2s ease-in-out infinite}
.fl{position:absolute;font-size:2rem;animation:bob 5s ease-in-out infinite}
.f1{right:9%;top:22px}.f2{right:24%;top:70px;animation-delay:-1.6s;font-size:1.6rem}.f3{right:3%;top:96px;animation-delay:-3s;font-size:1.4rem}
.cf{position:fixed;top:-14px;width:10px;height:14px;border-radius:2px;z-index:60;pointer-events:none;animation:fall 2.2s ease-in forwards}
.gcount{font-weight:800;color:var(--sub);margin:0 0 6px}
.gcard{font:600 1.15rem/1.45 "Baloo 2",sans-serif;background:var(--bg);border:2px solid var(--bd);border-radius:18px;padding:22px 20px;margin:0 0 14px;transition:background .3s}
.gcard.yes{background:var(--okbg);animation:pop .45s}.gcard.no{background:var(--badbg);animation:shake .4s}
.grow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.gbtn{position:relative;overflow:hidden;flex:1 1 140px;border:2px solid var(--bd);border-radius:14px;padding:12px;background:var(--card);color:var(--ink);font:800 16px Nunito,sans-serif;cursor:pointer;box-shadow:4px 4px 0 var(--sk);transition:transform .15s,box-shadow .15s}
.gbtn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--sk)}.gbtn:disabled{opacity:.6;cursor:default}
.pw{width:100%;font:700 18px Nunito,sans-serif;padding:12px 14px;border:2px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--ink);margin-bottom:12px}
.meter{height:16px;border:2px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg)}.meter i{display:block;height:100%;transition:width .4s cubic-bezier(.3,1.5,.5,1),background .4s}
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.flips button{height:170px;perspective:800px;background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit;transition:transform .2s}.flips button:hover{transform:translateY(-4px) rotate(-1deg)}
.in3{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.3,.5,1)}.f .in3{transform:rotateY(180deg)}
.fa,.fb2{position:absolute;inset:0;backface-visibility:hidden;border:2px solid var(--bd);border-radius:18px;box-shadow:5px 5px 0 var(--sk);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center;font-weight:700}
.fa{background:var(--card);font:800 1.15rem "Baloo 2",sans-serif}.fa b{font-size:2.4rem;line-height:1.1}.fb2{transform:rotateY(180deg);background:var(--sun);color:#1d2b5c}
.page-enter-active,.slide-enter-active,.fb-enter-active{transition:all .4s cubic-bezier(.3,1.3,.5,1)}.page-leave-active,.slide-leave-active,.fb-leave-active{transition:all .2s ease-in}
.page-enter-from{opacity:0;transform:translateY(24px) scale(.98)}.page-leave-to{opacity:0;transform:translateY(-12px)}
.slide-enter-from{opacity:0;transform:translateX(40px)}.slide-leave-to{opacity:0;transform:translateX(-40px)}
.fb-enter-from{opacity:0;transform:translateY(-10px) scale(.95)}.fb-leave-to{opacity:0}
.st-enter-active{animation:pop .6s both;animation-delay:var(--d)}
.rv{animation:in .6s both}
details:nth-of-type(4){border-left:10px solid var(--teal)}details:nth-of-type(5){border-left:10px solid var(--coral)}details:nth-of-type(6){border-left:10px solid var(--sun)}details:nth-of-type(7){border-left:10px solid var(--teal)}
.xp{display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:700;font-size:14px;color:#fff;flex-wrap:wrap}.xb{flex:1;min-width:120px;height:12px;border-radius:12px;background:#ffffff26;overflow:hidden}.xb i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),#ff9f43);transition:width .7s cubic-bezier(.3,1.4,.5,1);box-shadow:0 0 10px #ffc93c}
.toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:70;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--sun);color:#1d2b5c;border:2px solid var(--bd);border-radius:999px;padding:4px 14px;font:800 15px "Baloo 2",sans-serif;box-shadow:3px 3px 0 var(--bd)}
.tz-enter-active{animation:pop .4s}.tz-leave-active{transition:all .5s}.tz-leave-to{opacity:0;transform:translateY(-20px)}
.mascot{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:50;display:flex;align-items:flex-end;gap:8px;max-width:min(300px,78vw);pointer-events:none}
.mascot span{font-size:2.6rem;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 3px 0 var(--sk))}
.bub{background:var(--card);border:2px solid var(--bd);border-radius:16px 16px 4px 16px;padding:8px 12px;font-size:14px;line-height:1.35;margin:0;box-shadow:3px 3px 0 var(--sk)}
@media (max-width:480px){.pet .bub{max-width:58vw;font-size:13px}}
.fact{background:var(--midbg);border:2px dashed var(--bd);border-radius:16px;padding:12px 16px;margin:0 0 16px;overflow:hidden}.fact p{margin:0 0 .6rem}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pairs .opt{font-size:14px;margin:0 0 8px;padding:10px 12px}.opt.sel{border-color:var(--teal);transform:translateY(-3px) rotate(-1deg)}
.dip{position:relative;overflow:hidden;text-align:center;background:linear-gradient(135deg,var(--midbg),var(--card));border:4px double var(--bd);border-radius:20px;padding:26px 18px;box-shadow:6px 6px 0 var(--sk)}.dip p{margin:0 auto .5rem}.dip h2::after{margin:6px auto 0}
.seal{font-size:3.4rem;animation:pop .8s both,bob 3s 1s infinite}.shine{position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff88,transparent);transform:skewX(-20deg);animation:shn 3.5s infinite}
.dbd{display:flex;justify-content:center;gap:8px;font-size:1.6rem;flex-wrap:wrap}
@keyframes shn{to{left:140%}}
.card{transition:transform .2s}.card:hover{transform:translateY(-2px)}
@supports (animation-timeline:view()){.card,details,.fact{animation:in linear backwards;animation-timeline:view();animation-range:entry 0% entry 35%}}
.map{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.stop{display:flex;gap:6px;align-items:center;border:2px solid var(--bd);border-radius:999px;padding:5px 14px 5px 6px;background:var(--card);color:var(--ink);font:700 14px Nunito,sans-serif;cursor:pointer;animation:pop .5s both;transition:transform .2s}.stop:hover{transform:translateY(-3px) rotate(-2deg)}
.stop i{width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;transition:background .4s}.stop.done i{background:var(--teal);color:#fff}.stop.here{box-shadow:3px 3px 0 var(--sun);animation:pop .5s both,pulse 2s 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.teacher table{border-collapse:collapse;width:100%;font-size:14px;margin-top:6px}.teacher td,.teacher th{border:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.mascot{flex-direction:row-reverse;max-width:none}.pet{position:relative}.pb{font-size:2.6rem;background:none;border:0;cursor:pointer;pointer-events:auto;padding:0;line-height:1;filter:drop-shadow(0 3px 0 var(--sk));animation:bob 3s ease-in-out infinite;transform-origin:50% 90%}.pet:last-child .pb{animation-delay:-1.5s}
.pet .bub{position:absolute;bottom:105%;right:0;width:max-content;max-width:210px;pointer-events:none}
.pb.hop{animation:hop .6s!important}.pb.shk{animation:shake .5s!important}.pb.wave{animation:wave .9s!important}
@keyframes hop{40%{transform:translateY(-28px) rotate(-8deg) scale(1.15)}70%{transform:translateY(0) scale(.95)}}@keyframes wave{25%{transform:rotate(-18deg)}50%{transform:rotate(16deg)}75%{transform:rotate(-10deg)}}
.sp{position:fixed;z-index:80;pointer-events:none;font-style:normal;transform:translate(-50%,-50%);animation:spk .8s ease-out forwards}@keyframes spk{to{opacity:0;transform:translate(-50%,-190%) scale(1.6) rotate(40deg)}}
.hero h2{background:linear-gradient(90deg,#fff 40%,var(--sun),#fff 60%);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 4s linear infinite}@keyframes shim{to{background-position:-200% 0}}
.opt{animation:in .45s backwards}.xpn{display:inline-block;animation:pop .4s}
.next{text-align:center;margin-top:14px;padding-bottom:80px}.main-btn.pulse{animation:pulse 1.3s infinite;box-shadow:4px 4px 0 var(--bd),0 0 16px #ffc93c}
.tbar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-bottom:8px}.tbar i{display:block;height:100%;background:var(--coral);transition:width .1s linear}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}.mc{height:84px;perspective:600px;background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit}.mc .fa{font-size:1.6rem}.mc .fb2{font-size:12px;padding:4px;line-height:1.15}.mc.d .fb2{background:var(--okbg)}
.ag{display:flex;gap:14px;font-weight:800;margin-bottom:8px}.agg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.cell{height:70px;border:2px dashed var(--line);border-radius:14px;background:var(--bg);color:var(--ink);cursor:pointer;font:700 13px Nunito,sans-serif;padding:4px;overflow:hidden}.cell.on{border-style:solid;border-color:var(--bd)}.cm{display:block;animation:pop .3s}
footer{text-align:center;color:var(--sub);font-size:14px;padding:0 18px 30px}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes bob{50%{transform:translateY(-8px)}}@keyframes stripe{to{background-position:34px 0}}@keyframes march{to{stroke-dashoffset:-30}}
@keyframes step{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes glow{50%{filter:drop-shadow(0 0 8px #ffc93c);transform:scale(1.2)}}@keyframes glow2{50%{box-shadow:0 0 14px 3px #ffc93c99}}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(720deg)}}@keyframes flow{50%{background-position:100% 0}}
@keyframes grow{from{width:0}}@keyframes drift{50%{transform:translate(40px,-50px) scale(1.15)}}
@keyframes rip{to{transform:scale(4);opacity:0}}@keyframes ring{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-14deg)}90%{transform:rotate(12deg)}95%{transform:rotate(-8deg)}}

/* Modo oscuro: bordes de tarjeta más legibles */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card{box-shadow:5px 5px 0 #0a0f22}}
:root[data-theme="dark"] .card{box-shadow:5px 5px 0 #0a0f22}
@media print{nav button::after,.logo::after,.hero::before{display:none!important}}

/* ===== Créditos ===== */
.cred h3{margin-top:0}
.cred-l{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.cred-l li{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-left:5px solid var(--teal);border-radius:4px 12px 12px 4px;background:var(--bg)}
.cred-l li span{color:var(--sub);font-size:.95em}
.cred-l a{color:var(--teal);text-decoration-thickness:2px;text-underline-offset:3px}
.cred-pets{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;text-align:center}
.cred-pets>div{display:flex;flex-direction:column;align-items:center;padding:12px 8px;border:2px solid var(--bd);border-radius:16px;background:var(--bg)}
.cred-pets i{font-style:normal;font-size:2.4rem;line-height:1.2}
.cred-pets small{color:var(--sub)}
.cred-end{text-align:center;margin:22px 0 10px;color:var(--sub)}
.next-end{text-align:center;padding-bottom:80px}
@media (prefers-reduced-motion:no-preference){
  .cred-pets>div{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
  .cred-pets>div:hover{transform:translateY(-6px) rotate(-2deg)}
  .cred-pets>div:nth-child(even):hover{transform:translateY(-6px) rotate(2deg)}
}
@media print{.cred-pets>div{break-inside:avoid}}


/* ===== V2 · capa visual 2.0 ===== */
:root{--mint:#3ee0c4;--lila:#8b6cff;--ink:#14204f;--bg:#f3f6ff;--line:#dbe3f7;--sk:#d7dffa;--sh:0 1px 0 #fff inset,0 12px 30px -14px #1d2b5c44,0 2px 6px #1d2b5c14}
body{background:radial-gradient(52rem 36rem at 100% -8%,#3ee0c42b,transparent 60%),radial-gradient(46rem 36rem at -10% 45%,#8b6cff22,transparent 60%),var(--bg)}
h2{letter-spacing:-.01em}
header{background:radial-gradient(40% 100% at 92% 0,#3ee0c444,transparent 70%),radial-gradient(35% 100% at 5% 100%,#8b6cff55,transparent 70%),linear-gradient(120deg,#0a1030,#2236a8 62%,#4b3bd0);animation:none;border-bottom:0;position:relative;box-shadow:0 14px 30px -14px #0a1030aa}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--mint),var(--sun),var(--coral))}
nav button{border-radius:14px 14px 0 0;font-weight:800}
nav button[aria-selected="true"]{box-shadow:inset 0 3px 0 var(--sun)}
.jp i{background:linear-gradient(90deg,var(--mint),var(--sun))}
.card,details,.opt{border:1px solid var(--line);box-shadow:var(--sh)}
.card{border-radius:24px}
details:nth-of-type(n){border-left-width:6px}
details[open]{transform:none;box-shadow:0 20px 40px -18px #1d2b5c55}
.opt{border-radius:18px}
.opt:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 24px -12px #1d2b5c55;border-color:var(--teal)}
.opt:active:not(:disabled){transform:scale(.99);box-shadow:var(--sh)}
.opt.s2{border-color:#22a06b}.opt.s0{border-color:var(--coral)}
.main-btn{background:linear-gradient(135deg,#ffd25e,#ff9f43);border:0;border-radius:14px;box-shadow:0 4px 0 #c4741a,0 12px 18px -10px #ff9f43aa}
.main-btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #c4741a,0 16px 22px -10px #ff9f43cc}
.main-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c4741a}
.hero{border:0;border-radius:30px;box-shadow:0 26px 50px -24px #0a1030cc;background:radial-gradient(circle at 88% 15%,#3ee0c466,transparent 40%),radial-gradient(circle at 8% 95%,#8b6cff66,transparent 45%),linear-gradient(135deg,#0a1030,#2236a8)}
.bub{border:0;box-shadow:0 10px 22px -10px #0a1030aa}
.toast{border:0;box-shadow:0 10px 20px -10px #0a1030aa}
.pb{filter:drop-shadow(0 6px 6px #0a103044)}
/* portada */
.gate.v2{align-items:center;background:radial-gradient(60% 50% at 12% 8%,#3ee0c44d,transparent 70%),radial-gradient(55% 55% at 92% 90%,#8b6cff66,transparent 70%),radial-gradient(40% 40% at 85% 8%,#ff6b7744,transparent 70%),#0a1030;animation:none}
.g-hero{position:relative;z-index:1;width:min(1080px,100%);margin:auto;display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
@media(min-width:880px){.g-hero{grid-template-columns:1.15fr .85fr;gap:44px;align-items:center}}
.g-left{color:#fff;text-align:left}
.v2 .g-kicker{display:inline-flex;align-items:center;gap:9px;margin:0;background:#ffffff14;border:1px solid #ffffff33;color:#dfe8ff;border-radius:999px;padding:5px 14px;font-size:.88rem}
.g-kicker .dot{width:9px;height:9px;border-radius:50%;background:var(--mint);animation:live 2s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 #3ee0c499}100%{box-shadow:0 0 0 10px #3ee0c400}}
.v2 .g-title{font-size:clamp(2.7rem,10vw,5.4rem);line-height:.95;letter-spacing:-.02em;color:#fff;margin:1rem 0 .5rem;text-shadow:0 5px 0 #0a103099}
.v2 .gw{display:block;margin:0}
.v2 .ch,.v2 .ch:nth-child(4n+2),.v2 .ch:nth-child(4n+4){color:#fff}
.v2 .gw:last-child .ch,.v2 .gw:last-child .ch:nth-child(4n+2),.v2 .gw:last-child .ch:nth-child(4n+4){color:#ffd25e}
.v2 .g-sub{display:inline-block;margin:.2rem 0 .9rem;color:#0a1030;background:var(--mint);border-radius:12px 12px 12px 3px;padding:3px 14px;font-size:clamp(1.15rem,3.6vw,1.6rem)}
.g-lead{color:#dfe8ff;font-size:1.1rem;max-width:44ch;margin:0 0 1rem;animation:in .6s 1.2s backwards}
.v2 .kw li{background:#ffffff12;color:#eaf0ff;border:1px solid #ffffff2e}
.v2 .g-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:1.3rem 0 0}
.v2 .g-stats span{display:flex;flex-direction:column;border:1px solid #ffffff2e;background:#ffffff10;color:#cdd8ff;border-radius:16px;padding:8px 10px;font-size:.8rem;line-height:1.2;text-align:left}
.g-stats b{font:800 1.9rem/1 "Baloo 2",sans-serif;color:#fff}
.g-right{display:flex;flex-direction:column;gap:0}
.g-stage{background:linear-gradient(160deg,#ffffff24,#ffffff0a);border:1px solid #ffffff38;border-radius:30px;padding:16px 16px 18px;box-shadow:0 26px 60px -20px #000a;animation:stageIn .9s .5s cubic-bezier(.2,1.2,.3,1) backwards}
@keyframes stageIn{from{opacity:0;transform:translateY(40px) scale(.92)}}
.v2 .g-crew{margin:0 0 12px}
.v2 .g-pet{background:radial-gradient(circle at 50% 38%,#ffffff2e,transparent 68%);border:0;box-shadow:none;color:#fff}
.v2 .g-pet:hover{transform:translateY(-4px) scale(1.04)}
.v2 .g-pet .pb{font-size:4.4rem}
.v2 .g-pet b{color:#fff}.v2 .g-pet small{color:#cdd8ff}
.v2 .g-say{background:#fff;color:#14204f;border:0;border-radius:18px 18px 18px 4px;box-shadow:0 8px 0 #0a103055;margin:0}
.g-perm{position:relative;margin-top:34px;background:#fff;color:#14204f;border-radius:26px;padding:34px 18px 16px;text-align:center;box-shadow:0 26px 50px -18px #000b;animation:in .7s 1.1s backwards}
.perm-ic{position:absolute;left:50%;top:-28px;width:56px;height:56px;margin-left:-28px;border-radius:18px;background:linear-gradient(135deg,#ffd25e,#ff9f43);display:grid;place-items:center;font-size:28px;transform:rotate(-7deg);box-shadow:0 10px 20px -6px #ff9f4399}
.v2 .g-q{font-size:1.5rem;color:#14204f;margin:0 0 .2rem}
.v2 .g-note{color:#4f5c86;margin:0 auto 1rem}
.v2 .g-btns{flex-direction:column;gap:6px}
.v2 .g-yes{width:100%;font-size:1.2rem;padding:14px 20px;border-radius:16px;animation:pulse 2.2s 2.6s infinite}
.v2 .g-yes::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,#fff9,transparent);transform:skewX(-20deg);animation:gsh 3.4s 2.4s infinite}
@keyframes gsh{to{left:140%}}
.v2 .g-yes:hover{transform:translateY(-2px)}
.v2 .g-nob{border:0;color:#4f5c86;text-decoration:underline;text-underline-offset:3px;font-weight:700}
.v2 .g-nob:hover{background:transparent;color:#14204f}
.v2 .g-card{background:#fff;color:#14204f;border:0;border-radius:28px;box-shadow:0 26px 60px -20px #000b;padding:28px 22px;width:min(500px,100%)}
.v2 .g-card h2,.v2 .g-card p{color:#14204f}
@media(max-width:879px){.g-left .kw{display:none}.v2 .g-stats{gap:6px}.v2 .g-stats span{padding:6px 8px;font-size:.7rem}.g-stats b{font-size:1.4rem}.v2 .g-pet .pb{font-size:3.4rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===== V2.1 · portada para niños ===== */
.gate.v2{background:linear-gradient(180deg,#4f6df5 0%,#8b5cf6 52%,#ff7ab6 100%)}
.v2 .g-bg::before{opacity:.9}
.v2 .gf{font-size:2.6rem!important;animation-name:rise2}
@keyframes rise2{0%{transform:translateY(0) rotate(-10deg);opacity:0}12%,85%{opacity:.95}100%{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.g-bg::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-16vh;height:40vh;background:radial-gradient(55% 100% at 18% 100%,#3ddc97 0 62%,transparent 63%),radial-gradient(60% 100% at 82% 100%,#1fbf84 0 62%,transparent 63%),radial-gradient(40% 70% at 50% 100%,#6ff0b4 0 62%,transparent 63%)}
.rainbow{position:absolute;right:-6vw;top:6vh;width:min(46vw,420px);aspect-ratio:2/1;border-radius:999px 999px 0 0;background:radial-gradient(circle at 50% 100%,transparent 52%,#ff6b77 53% 58%,#ffd25e 58% 63%,#5eead4 63% 68%,#6aa8ff 68% 73%,#b08cff 73% 78%,transparent 79%);opacity:.85}
.cloud{position:absolute;width:120px;height:40px;border-radius:40px;background:#fff;opacity:.9;box-shadow:40px -18px 0 8px #fff,-26px -10px 0 -2px #fff;animation:cdrift 60s linear infinite}
.cloud.c1{top:12vh;left:-160px}.cloud.c2{top:34vh;left:-160px;animation-duration:85s;animation-delay:-30s;transform:scale(.7)}.cloud.c3{top:58vh;left:-160px;animation-duration:70s;animation-delay:-50s;transform:scale(.5)}
@keyframes cdrift{to{translate:calc(100vw + 360px) 0}}
.v2 .g-kicker{background:#ffd25e;color:#14204f;border:0;font-weight:800;box-shadow:0 4px 0 #c4741a;transform:rotate(-2deg)}
.g-kicker .dot{background:#ff3d71}
.v2 .g-title{font-size:clamp(3rem,12vw,6.2rem);text-shadow:0 2px 0 #2a1d86,0 4px 0 #2a1d86,0 6px 0 #2a1d86,0 8px 0 #2a1d86,0 16px 22px #0006}
.v2 .ch:nth-child(5n+1){color:#fff}.v2 .ch:nth-child(5n+2){color:#ffe066}.v2 .ch:nth-child(5n+3){color:#7dfbe0}.v2 .ch:nth-child(5n+4){color:#ffb3d1}.v2 .ch:nth-child(5n+5){color:#c9b8ff}
.v2 .gw:last-child .ch:nth-child(n){color:inherit}
.v2 .gw:last-child .ch:nth-child(5n+1){color:#ffe066}.v2 .gw:last-child .ch:nth-child(5n+2){color:#7dfbe0}.v2 .gw:last-child .ch:nth-child(5n+3){color:#ffb3d1}.v2 .gw:last-child .ch:nth-child(5n+4){color:#fff}.v2 .gw:last-child .ch:nth-child(5n+5){color:#ffe066}
.v2 .g-sub{background:#fff;color:#2a1d86;box-shadow:0 5px 0 #2a1d86;border-radius:16px;padding:4px 16px;transform:rotate(-1.5deg)}
.v2 .g-lead{color:#fff;font-size:1.25rem;font-weight:700;text-shadow:0 2px 0 #2a1d8688}
.v2 .kw li{border:0;color:#14204f;font-weight:800;box-shadow:0 3px 0 #0003}
.v2 .kw li:nth-child(4n+1){background:#ffe066}.v2 .kw li:nth-child(4n+2){background:#7dfbe0}.v2 .kw li:nth-child(4n+3){background:#ffb3d1}.v2 .kw li:nth-child(4n+4){background:#c9b8ff}
.v2 .g-stats span{border:0;color:#14204f;font-weight:800;box-shadow:0 5px 0 #0003;transform:rotate(-2deg)}
.v2 .g-stats span:nth-child(1){background:#ffe066}.v2 .g-stats span:nth-child(2){background:#7dfbe0;transform:rotate(2deg)}.v2 .g-stats span:nth-child(3){background:#ffb3d1}.v2 .g-stats span:nth-child(4){background:#c9b8ff;transform:rotate(2deg)}
.g-stats b{color:#14204f}
.g-stage{background:#ffffff33;border:3px solid #fff;box-shadow:0 8px 0 #2a1d8666,0 30px 50px -20px #0007}
.v2 .g-pet{background:none;position:relative}
.v2 .g-pet::before{content:"";position:absolute;top:6px;width:6.4rem;height:6.4rem;border-radius:50%;background:#fff;box-shadow:0 6px 0 #2a1d8655;z-index:0}
.v2 .g-pet.p1::before{background:#ffe9a8}
.v2 .g-pet .pb{font-size:5rem;position:relative;z-index:1}
.v2 .g-pet b{background:#2a1d86;color:#fff;border-radius:999px;padding:0 14px;margin-top:4px}
.v2 .g-pet small{color:#fff;font-weight:800;text-shadow:0 1px 0 #2a1d86}
.g-hint{margin:0 0 8px;text-align:center;color:#fff;font:800 1rem "Baloo 2",sans-serif;animation:bob 1.6s ease-in-out infinite;max-width:none}
.g-more{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;color:#fff}
.g-more small{font-weight:800;margin-right:4px;text-shadow:0 1px 0 #2a1d86}
.g-more span{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:1.6rem;box-shadow:0 4px 0 #2a1d8655;animation:bob 2.4s ease-in-out infinite}
.g-perm{border:4px solid #fff;box-shadow:0 8px 0 #2a1d8666,0 30px 50px -20px #000b}
.perm-ic{animation:wave 2.6s 2s infinite;transform-origin:50% 80%}
.v2 .g-yes{background:linear-gradient(180deg,#5cf0a8,#1fbf84);color:#06432b;font-size:1.45rem;padding:16px 20px;box-shadow:0 6px 0 #138a5c,0 16px 24px -10px #1fbf84cc}
.v2 .g-yes:hover{box-shadow:0 8px 0 #138a5c,0 20px 28px -10px #1fbf84cc}
.v2 .g-yes:active{box-shadow:0 1px 0 #138a5c}
.v2 .g-q{font-size:1.65rem}
@media(max-width:879px){.v2 .g-pet::before{width:5rem;height:5rem}.v2 .g-pet .pb{font-size:4rem}.rainbow{opacity:.5}.g-more small{display:none}}

/* ===== V3 · creadores (caricaturas) ===== */
.cr-hint{color:var(--sub);margin:-.2rem 0 .6rem}
.cr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px 14px;margin-top:0}
.cr-card{--c1:#b9fff0;--c2:#3ee0c4;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:0 12px 16px;margin-top:62px;border:0;border-radius:24px;background:var(--bg);box-shadow:var(--sh),inset 0 -6px 0 var(--c2);color:var(--ink);font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.cr-card.ruben{--c1:#b9fff0;--c2:#3ee0c4}.cr-card.juan{--c1:#fff0b3;--c2:#ffc93c}.cr-card.rodrigo{--c1:#ffd0d4;--c2:#ff7a85}
.cr-card:hover{transform:translateY(-4px)}.cr-card:active{transform:scale(.97)}
.cr-av{position:relative;display:block;width:118px;height:118px;margin-top:-56px;border-radius:50%;background:radial-gradient(circle at 50% 30%,var(--c1),var(--c2));border:4px solid #fff;box-shadow:0 6px 0 #2a1d8655}
.cr-av img{position:absolute;left:50%;bottom:-3px;width:122px;height:122px;margin-left:-61px;max-width:none;pointer-events:none;user-select:none}
.cr-card.on .cr-av{animation:crhop .7s}
@keyframes crhop{35%{transform:translateY(-14px) rotate(-6deg) scale(1.06)}65%{transform:translateY(0) rotate(4deg)}}
.cr-name{font:800 1.2rem/1.1 "Baloo 2",sans-serif;margin-top:8px}
.cr-tag{font-weight:800;font-size:.8rem;background:var(--c2);color:#14204f;border-radius:14px;padding:2px 12px;line-height:1.3}
.cr-card small{color:var(--sub);font-size:.86rem;line-height:1.3;margin-top:4px}
.dcr{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:13px;font-weight:700}
.dcr>small{opacity:.75}.dcr-p{display:flex;flex-direction:column;align-items:center}.dcr-p img{width:38px;height:38px}.dcr-p em{font-style:normal;font-size:11px}
.ft-crew{display:inline-flex;align-items:center;gap:10px;margin:10px 4px 0;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 8px;color:var(--sub);font:700 13px Nunito,sans-serif;cursor:pointer}
.ft-crew .stack{display:flex}.ft-crew img{width:30px;height:30px;margin-left:-6px}.ft-crew img:first-child{margin-left:0}
@media print{.ft-crew{display:none}}

/* ===== V3 · rendimiento ===== */
.gate-leave-to,.page-enter-from{filter:none!important}
html.hid *,html.hid *::before,html.hid *::after{animation-play-state:paused!important}
html.lite *,html.lite *::before,html.lite *::after{animation-iteration-count:1!important}
html.lite :not(.badges span){filter:none!important}
html.lite .blob,html.lite .tr,html.lite .cr,html.lite .shine{display:none!important}
html.lite .cloud{animation:none!important}
html.lite .cloud.c1{translate:10vw 0}html.lite .cloud.c2{translate:60vw 0}html.lite .cloud.c3{translate:35vw 0}
html.lite header h1,html.lite .hero h2{animation:none!important}
@supports (animation-timeline:view()){html.lite .card,html.lite details,html.lite .fact{animation:none!important}}
html.lite main .card:not(.cr-team),html.lite main details{content-visibility:auto;contain-intrinsic-size:auto 220px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.route{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.rt{border:2px solid var(--bd);background:var(--card);border-radius:16px;padding:10px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;box-shadow:4px 4px 0 var(--sk)}
.rt b{display:block;font:800 1.05rem "Baloo 2",sans-serif}.rt small{display:block;color:var(--sub)}
.rt.done{background:var(--okbg)}.rt[aria-current="step"]{outline:3px solid var(--sun)}
.lvl{letter-spacing:2px;color:var(--coral)}
.think{background:var(--midbg);border-left:10px solid var(--sun)}
.think b{font-family:"Baloo 2",sans-serif;font-size:1.15rem}
.guide{display:flex;gap:10px;align-items:center;font-weight:700}.guide i{font-style:normal;font-size:2.2rem}
.res{border-left:10px solid var(--teal)}
.res .tags span{display:inline-block;background:var(--midbg);border:2px solid var(--bd);border-radius:999px;padding:1px 10px;margin:0 6px 6px 0;font-size:14px;font-weight:700}
.phase{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;margin:.4rem 0}.phase b{color:var(--teal)}
.ficha{margin:6px 0 12px}.ficha summary{font-size:1rem}.ficha table,.tview table{width:100%;border-collapse:collapse;font-size:15px}
.ficha td,.ficha th,.tview td,.tview th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.ficha th,.tview th{background:var(--midbg);width:34%}.tview th{width:auto}
.tview{overflow-x:auto}.tview table{min-width:640px;margin-bottom:18px}
.act{margin:0 0 22px}.act h3 .pc{font:700 13px Nunito,sans-serif;background:var(--teal);color:#fff;border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:middle}
.dn{display:inline-block;margin-left:8px;color:var(--teal);font-weight:800}
.meter2{display:flex;gap:6px;margin:8px 0}.meter2 button{flex:1}
.mini-in{width:100%;padding:10px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;margin:6px 0}
.alr{min-height:110px;display:grid;place-items:center;text-align:center;font-weight:700;font-size:1.15rem;border:2px dashed var(--bd);border-radius:16px;padding:10px;margin:8px 0}
.pact{border:3px double var(--bd);border-radius:18px;padding:16px;background:var(--card);margin-top:12px}
.seg{display:flex;flex-wrap:wrap;gap:8px}.seg .opt{width:auto;flex:1 1 150px;text-align:center}
.mview{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tbtn.on{background:var(--sun);color:#1d2b5c;border-color:var(--sun)}
.pill{display:inline-block;border:2px solid var(--bd);border-radius:999px;padding:0 10px;font-weight:700;font-size:14px;background:var(--midbg)}
@media print{header,nav,.noprint,.mview{display:none!important}body{background:#fff}.tview table{min-width:0}}


/* Barra de desplazamiento visible en el menú de secciones */

nav::-webkit-scrollbar-track{background:#ffffff30;border-radius:999px}
nav::-webkit-scrollbar-thumb{background:var(--sun);border-radius:999px;border:2px solid transparent;background-clip:padding-box}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/x-template" id="tpl">
<div id="app" :class="{t:teacher,proj:proj,quiet:quiet,calm:calm,scr:scr}">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="jsh" viewBox="0 0 120 112"><defs><clipPath id="jcl"><path d="M18 109Q18 84 60 84Q102 84 102 109Z"/></clipPath></defs><ellipse cx="60" cy="108" rx="34" ry="4" fill="#0003"/><path d="M18 109Q18 84 60 84Q102 84 102 109Z" fill="#fff"/><g clip-path="url(#jcl)" fill="#d62839"><rect x="26" y="80" width="12" height="32"/><rect x="50" y="80" width="12" height="32"/><rect x="74" y="80" width="12" height="32"/></g><path d="M18 109Q18 84 60 84Q102 84 102 109Z" fill="none" stroke="#1d2b5c" stroke-width="3.5" stroke-linejoin="round"/><path d="M46 85Q60 96 74 85" fill="#1d2b5c"/><path class="jfin" d="M58 8L78 36L42 36Z" fill="#5f7fa8" stroke="#1d2b5c" stroke-width="3.5" stroke-linejoin="round"/><ellipse cx="60" cy="58" rx="42" ry="29" fill="#7b9bc4" stroke="#1d2b5c" stroke-width="3.5"/><ellipse cx="60" cy="70" rx="29" ry="15" fill="#e8f2fc"/><path d="M20 46Q60 26 100 46" fill="none" stroke="#d62839" stroke-width="7" stroke-linecap="round"/><path d="M24 40Q60 22 96 40" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 7"/><circle cx="43" cy="54" r="8.5" fill="#fff" stroke="#1d2b5c" stroke-width="3"/><circle cx="77" cy="54" r="8.5" fill="#fff" stroke="#1d2b5c" stroke-width="3"/><circle cx="45" cy="55" r="4.2" fill="#1d2b5c"/><circle cx="79" cy="55" r="4.2" fill="#1d2b5c"/><path d="M33 44l18 4M87 44l-18 4" stroke="#1d2b5c" stroke-width="3.2" stroke-linecap="round"/><path d="M40 69Q60 86 80 69" fill="#fff" stroke="#1d2b5c" stroke-width="3.5" stroke-linejoin="round"/><path d="M48 73l3 5 3-5M57 76l3 5 3-5M66 74l3 5 3-5" fill="none" stroke="#1d2b5c" stroke-width="1.8" stroke-linejoin="round"/><rect x="21" y="62" width="6" height="4" fill="#2fb7b0"/><rect x="93" y="62" width="6" height="4" fill="#2fb7b0"/><text x="60" y="104" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="12" fill="#1d2b5c">J</text><g class="jball"><circle cx="100" cy="98" r="10" fill="#fff" stroke="#1d2b5c" stroke-width="3"/><path d="M100 93l5 3.6-2 5.6h-6l-2-5.6z" fill="#1d2b5c"/></g></symbol></svg><i class="blob b1"></i><i class="blob b2"></i><div class="fx" aria-hidden="true"><i v-for="(f,i) in FX" :key="i" :style="f.s">{{f.e}}</i></div>
<i class="cf" v-for="c in conf" :key="c.id" :style="c.s"></i>
<i class="wipe" v-if="wk" :key="wk"></i>
<button type="button" class="totop" v-if="gate==='in'&&scrollP>.15" @click="toTop" aria-label="Subir al inicio">🚀</button>
<transition name="celx"><div class="cel" v-if="cel" tabindex="-1" v-focus @keydown.esc="celClose" role="dialog" aria-modal="true" aria-label="Celebración del diploma">
 <div class="cel-r" aria-hidden="true"></div><canvas ref="cv" class="cvs" aria-hidden="true"></canvas>
 <div class="cel-card"><div class="cel-medal" aria-hidden="true">🏆</div><h2 class="cel-t" :aria-label="celT"><span v-for="(c,i) in celT" :key="i" aria-hidden="true" :style="{'--i':i}">{{c===' '?'\u00a0':c}}</span></h2>
 <p class="cel-s">Medalla de {{MED}} · Nivel {{lvl+1}} · {{xp}} XP</p>
 <div class="cel-b" aria-hidden="true"><i v-for="(b,i) in BN" :key="i" v-show="on[i]" :style="{'--i':i}">{{b[0]}}</i></div>
 <div class="cel-crew" aria-hidden="true"><b class="cc" v-for="(e,i) in ['🦉','🦊','🦎','🦈']" :key="i" :class="['c'+i,celM[i],{talk:celL&&celL.w===i}]">{{e}}</b></div>
 <transition name="fb" mode="out-in"><p class="cel-say" v-if="celL" :key="celL.k" aria-live="polite"><b>{{['🦉 Búho','🦊 Pixel','🦎 Ciber'][celL.w]}}:</b> {{celL.t}}</p></transition>
 <p class="cel-n" v-if="!snd">🔇 Activa el sonido para oír la música.</p>
 <div class="cel-btns"><button class="main-btn" v-ripple v-magnet @click="celAgain">🎵 Otra vez</button><button class="main-btn" v-ripple v-magnet @click="celClose">Cerrar</button></div></div>
</div></transition>
<transition-group name="tz" tag="div" class="toasts"><div class="toast" v-for="t in toasts" :key="t.id">{{t.m}}</div></transition-group>
<i class="sp" v-for="s in sparks" :key="s.id" :style="s.s">{{s.e}}</i>
<b class="ring" v-for="s in sparks" :key="'r'+s.id" :style="s.s"></b>
<transition name="gate">
<div class="gate v2" v-if="gate!=='in'" role="dialog" aria-modal="true" aria-label="Ciudadanos digitales: portada">
 <div class="g-bg" aria-hidden="true"><i class="gf" v-for="(e,i) in GF" :key="i" :style="{left:e[1]+'%',animationDelay:e[2]+'s',animationDuration:e[3]+'s',fontSize:e[4]+'rem'}">{{e[0]}}</i><b class="rainbow"></b><b class="cloud c1"></b><b class="cloud c2"></b><b class="cloud c3"></b></div>
 <transition name="gpanel" mode="out-in">
 <div class="g-hero" v-if="gate==='intro'" key="intro">
  <section class="g-left">
   <p class="g-kicker"><span class="dot" aria-hidden="true"></span>🎟️ Objeto Virtual de Aprendizaje · Grado 6.º · ACT</p>
   <h1 class="g-title"><span class="gw" v-for="(w,a) in TW" :key="a"><span class="ch" aria-hidden="true" v-for="(c,b) in w" :key="b" :style="{'--i':a*10+b}">{{c}}</span><span class="sr">{{w}}</span></span></h1>
   <p class="g-sub">Decido con cabeza y corazón</p>
   <p class="g-lead">Seis misiones para entrenar cómo piensas: comprender, clasificar, aplicar, evaluar, decidir y crear, mientras cuidas tu huella digital.</p>
   <ul class="kw"><li v-for="(k,i) in KW" :key="k" :style="{animationDelay:(1.4+i*.09)+'s'}">{{k}}</li></ul>
   <div class="g-stats"><span><b>{{MIS.length}}</b>misiones</span><span><b>{{TOT}}</b>actividades</span><span><b>{{BN.length}}</b>insignias</span><span><b>6</b>sesiones de 45 min</span></div>
  </section>
  <section class="g-right">
   <div class="g-stage">
    <div class="g-crew"><div class="g-pet" v-for="(c,w) in CH" :key="w" :class="'p'+w"><button class="pb" :class="mood[w]" :aria-label="'Saludar a '+c[1]" @click="gPoke(w)">{{c[0]}}</button><b>{{c[1]}}</b><small>{{CR[w]}}</small></div></div>
    <p class="g-hint" aria-hidden="true">👆 ¡Toca a tus amigos!</p>
    <transition name="slide" mode="out-in"><p class="g-say" :key="gi" aria-live="polite"><span><b>{{CH[GL[gi][0]][0]}} {{CH[GL[gi][0]][1]}}:</b> {{GL[gi][1]}}</span></p></transition>
    <div class="g-more"><small>Dentro te esperan:</small><span v-for="(c,i) in CREW" :key="i" :style="{animationDelay:(i*.25)+'s'}" :title="c[1]">{{c[0]}}</span></div>
   </div>
   <div class="g-perm" role="group" aria-labelledby="gq">
    <div class="perm-ic" aria-hidden="true">🚀</div>
    <p class="g-q" id="gq">¿Permitir la entrada a la misión?</p>
    <p class="g-note">No pide cuentas ni datos personales. Tú decides si entras.</p>
    <div class="g-btns"><button class="main-btn g-yes" v-ripple v-magnet v-focus @click="enter">{{hasProg?'▶️ Continuar mi misión':'🚀 ¡Sí, vamos!'}}</button><button class="g-nob" @click="later">No, por ahora</button></div>
   </div>
  </section>
 </div>
 <div class="g-card g-bye" v-else key="no">
  <div class="g-em" aria-hidden="true">👋</div>
  <h2>¡Está bien!</h2>
  <p>Sin problema. La misión seguirá aquí cuando quieras entrar.</p>
  <div class="g-btns"><button class="main-btn g-yes" v-ripple v-magnet v-focus @click="enter">🚀 Mejor sí, ¡entrar!</button><button class="g-nob" @click="toIntro">Volver a la portada</button></div>
 </div>
 </transition>
</div>
</transition>
<transition name="shell">
<div class="shell" v-if="gate==='in'">
<div class="spbar" aria-hidden="true"><i :style="{transform:'scaleX('+scrollP+')'}"></i></div>
<transition name="award"><div class="award" v-if="award" :key="award.k" aria-live="polite"><div class="ac"><div class="rays"></div><div class="ab">{{award.e}}</div><b>¡Insignia desbloqueada!</b><span>{{award.n}}</span></div></div></transition>
<div class="mascot"><div class="pet" v-for="(c,w) in CH" :key="w" :class="{talk:sp&&sp.w===w}"><transition name="fb"><p class="bub" v-if="sp&&sp.w===w&&sec!=='inicio'" :key="sp.k">{{sp.t}}</p></transition><button class="pb" :class="mood[w]" :aria-label="'Hablar con '+c[1]" @click="poke(w)" @dblclick="dbl(w)">{{c[0]}}</button></div></div>
<transition name="cin"><div class="ciber" v-if="cOn" @keydown.esc="cp=false">
<transition name="cpan"><div class="cpan" v-if="cp" role="dialog" aria-label="Ciber, el camaleón guardián">
 <div class="chd"><span>Ciber, camaleón guardián</span><span class="tlt" aria-hidden="true"><i class="r" :class="{on:verdict[0]==='r'}"></i><i class="y" :class="{on:verdict[0]==='y'}"></i><i class="g" :class="{on:verdict[0]==='g'}"></i></span><button type="button" class="cx" @click="cp=false" aria-label="Cerrar">✕</button></div>
 <p>Mi misión: que reconozcas el riesgo <b>antes</b> de publicar o compartir.</p>
 <div class="ctabs" role="tablist"><button type="button" v-for="(t,i) in CIB" :key="i" role="tab" :aria-selected="ct===i" :class="{on:ct===i}" :aria-label="t[1]" @click="ct=i">{{t[0]}}</button></div>
 <transition name="slide" mode="out-in"><div class="clsn" :key="ct"><h3>{{CIB[ct][1]}}</h3><p>{{CIB[ct][2]}}</p><p class="tip">🦎 {{CIB[ct][3]}}</p></div></transition>
 <h4>Escáner: antes de publicar</h4>
 <label class="chk" v-for="(t,i) in SCN" :key="i"><input type="checkbox" v-model="scn[i]"> {{t}}</label>
 <div class="cv" :class="verdict[0]" :key="verdict[0]" aria-live="polite"><b>{{verdict[1]}}.</b> {{verdict[2]}}</div>
</div></transition>
<transition name="fb"><p class="bub cbub" v-if="cb&&!cp" :key="cb">{{cb}}</p></transition>
<button type="button" class="cib" :class="[mood[2],ctl?'lz'+ctl:'',{ping:cping&&!cp,fly:cfly}]" @click="cToggle" @dblclick="dbl(2)" :aria-expanded="cp" aria-label="Hablar con Ciber, el camaleón guardián"><svg viewBox="0 0 120 112" aria-hidden="true"><defs><linearGradient id="cgB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7bf59a"/><stop offset="1" stop-color="#22b36f"/></linearGradient><linearGradient id="cgH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a63d6"/><stop offset="1" stop-color="#26357f"/></linearGradient></defs><ellipse cx="60" cy="108" rx="34" ry="4" fill="#0003"/><g class="cs"><path class="st" d="M12 28l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" fill="#ffc93c"/><path class="st" d="M108 14l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#fff"/><path d="M20 109Q20 86 60 86Q100 86 100 109Z" fill="url(#cgH)" stroke="#1d2b5c" stroke-width="3.5" stroke-linejoin="round"/><path d="M46 87Q60 100 74 87" fill="#e9ffb0" stroke="#1d2b5c" stroke-width="3" stroke-linejoin="round"/><path d="M78 95h13v7q0 5-6.5 7q-6.5-2-6.5-7z" fill="#ffc93c" stroke="#1d2b5c" stroke-width="2.5" stroke-linejoin="round"/><text x="84.5" y="105" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="9" fill="#1d2b5c">C</text><g class="hd"><g class="an"><path d="M60 30V14" stroke="#1d2b5c" stroke-width="3.5" stroke-linecap="round"/><circle class="ld" cx="60" cy="11" r="5.5" fill="#ffc93c" stroke="#1d2b5c" stroke-width="3"/></g><g class="bd" stroke="#1d2b5c" stroke-width="3.5" stroke-linejoin="round"><ellipse cx="60" cy="60" rx="42" ry="31" fill="url(#cgB)"/><circle cx="36" cy="38" r="15" fill="#3fd47a"/><circle cx="84" cy="38" r="15" fill="#3fd47a"/><circle cx="36" cy="38" r="10" fill="#fff" stroke-width="2.5"/><circle cx="84" cy="38" r="10" fill="#fff" stroke-width="2.5"/><g class="ey" stroke="none"><circle cx="38" cy="39" r="5.5" fill="#1d2b5c"/><circle cx="86" cy="39" r="5.5" fill="#1d2b5c"/><circle cx="40" cy="36.5" r="1.8" fill="#fff"/><circle cx="88" cy="36.5" r="1.8" fill="#fff"/></g><circle class="lid" cx="36" cy="38" r="10" fill="#2fbf6f" stroke="none"/><circle class="lid" cx="84" cy="38" r="10" fill="#2fbf6f" stroke="none"/></g><path d="M42 68Q60 84 78 68" fill="none" stroke="#1d2b5c" stroke-width="3.5" stroke-linecap="round"/><circle cx="55" cy="58" r="1.8" fill="#1d2b5c"/><circle cx="65" cy="58" r="1.8" fill="#1d2b5c"/><ellipse cx="28" cy="64" rx="6" ry="3.5" fill="#ff9aa2" opacity=".8"/><ellipse cx="92" cy="64" rx="6" ry="3.5" fill="#ff9aa2" opacity=".8"/><g class="tg"><path d="M60 76V94" stroke="#1d2b5c" stroke-width="10" stroke-linecap="round"/><path d="M60 76V94" stroke="#ff6b8b" stroke-width="5" stroke-linecap="round"/></g></g></g></svg><span class="cn">Ciber</span></button>
</div></transition>
<transition name="cin"><div class="jr" v-if="jFix" :class="{bs:cOn}">
<transition name="fb"><p class="bub jbub" v-if="jb" :key="jb" aria-live="polite">{{jb}}</p></transition>
<button type="button" class="jb" :class="[mood[3],{ping:jping}]" @click="jPoke" @dblclick="dbl(3)" aria-label="Hablar con Júnior, el tiburón estratega"><svg viewBox="0 0 120 112" aria-hidden="true"><use href="#jsh"/></svg><span class="cn">Júnior</span></button></div></transition>
<header>
 <div class="wrap">
  <div class="brand">
   <div class="logo" aria-hidden="true">🛡️</div>
   <div><h1>Ciudadanos digitales</h1><p>Decido con cabeza y corazón · Grado 6</p></div>
   <div class="tools"><button class="tbtn" :aria-pressed="snd" @click="snd=!snd" aria-label="Sonido">{{snd?'🔊':'🔇'}}</button><button class="tbtn" @click="poke(0)" aria-label="Dato curioso">💡</button><button class="tbtn" @click="callCiber" aria-label="Llamar a Ciber">🦎</button><button class="tbtn" @click="callJunior" aria-label="Llamar a Júnior">🦈</button><button class="tbtn" :aria-pressed="lite" @click="liteToggle" aria-label="Modo ligero: menos animaciones para que todo vaya más fluido" title="Modo ligero">⚡</button><button class="tbtn" @click="theme" aria-label="Cambiar tema claro u oscuro">🌓</button><button class="tbtn" :aria-pressed="teacher" @click="teacher=!teacher">Modo docente</button></div>
  </div>
  <div class="badges"><span style="background:none;border:0;width:auto;filter:none;opacity:1;animation:none">Mis insignias</span>
   <span v-for="(b,i) in BN" :key="i" :class="{on:on[i]}" :title="b[1]+(on[i]?' (lograda)':' (pendiente)')">{{b[0]}}</span></div>
  <div class="jp" aria-hidden="true"><i :style="{width:(secIdx+1)/SECS.length*100+'%'}"></i></div>
  <div class="xp"><b>Nivel {{lvl+1}} · {{LV[lvl]}}</b><div class="xb"><i :style="{width:xpPct+'%'}"></i></div><span :key="xp" class="xpn">{{xpShow}} XP</span><span class="combo" v-if="combo>=2" :key="combo">🔥 Racha x{{combo}}</span></div>
  <nav role="tablist" aria-label="Secciones del OVA">
   <button v-for="(s,i) in SECS" :key="s[0]" role="tab" :aria-selected="sec===s[0]" :style="{animationDelay:(.5+i*.08)+'s'}" @click="go(s[0])">{{s[1]}}</button>
  </nav>
 </div>
</header>
<main class="wrap">
<div class="tp" v-if="teacher"><div class="tph"><b>🎓 Panel docente</b><div class="tpt"><button type="button" v-for="(t,i) in TPT" :key="i" :class="{on:tpi===i}" @click="tpi=i">{{t}}</button></div></div>
<div v-if="tpi===0" class="tpb"><div class="tclock" :class="{low:tmr.left<=60&&tmr.run}">{{tmFmt}}</div><div class="prog"><i :style="{width:tmr.left/tmr.tot*100+'%'}"></i></div><div class="tpr"><button class="main-btn" @click="tmToggle">{{tmr.run?'⏸ Pausar':'▶ Iniciar'}}</button><button class="tbtn tl" v-for="m in [5,10,15,45]" :key="m" @click="tmSet(m)">{{m}} min</button></div></div>
<div v-else-if="tpi===1" class="tpb"><textarea v-model="names" rows="3" aria-label="Lista para sortear" placeholder="Iniciales o apodos, uno por línea. No se guardan."></textarea><div class="tpick" :class="{spin:spinning}">{{pickN||'🎲'}}</div><div class="tpr"><button class="main-btn" @click="rollName">🎲 Sortear turno</button><button class="tbtn tl" @click="usedN=[]">Reiniciar ronda</button></div></div>
<div v-else-if="tpi===2" class="tpb"><p>¿Qué luz elige la clase? Cuenta los votos a mano alzada.</p><div class="vts"><div v-for="(c,i) in LUCES" :key="i" class="vt"><button class="gbtn" @click="vote(i,1)">{{c[1]}}</button><div class="vbar"><i :class="'v'+c[0]" :style="{height:vt[i]/Math.max(1,vt[0]+vt[1]+vt[2])*100+'%'}"></i></div><b>{{vt[i]}}</b><button class="tbtn tl" @click="vote(i,-1)" aria-label="Restar voto">−</button></div></div><button class="tbtn tl" @click="vt.fill(0)">Reiniciar votos</button></div>
<div v-else-if="tpi===3" class="tpb"><div class="prog"><i :style="{width:gdN/GS.length*100+'%'}"></i></div><label class="chk" v-for="(g,i) in GS" :key="i"><input type="checkbox" v-model="gd[i]"> <b>{{g[0]}}</b> {{g[1]}} <button type="button" class="tbtn tl" @click.prevent="go(g[2])">Ir</button></label></div>
<div v-else class="tpb"><label class="chk"><input type="checkbox" v-model="proj"> 🖥️ Modo proyección (texto grande)</label><label class="chk"><input type="checkbox" v-model="quiet"> 🤫 Ocultar personajes y fondo</label><label class="chk"><input type="checkbox" v-model="calm"> 🧘 Pausar animaciones</label><label class="chk"><input type="checkbox" v-model="snd"> 🔊 Sonido y música</label></div></div>

<transition name="page" mode="out-in">

<section v-if="sec==='inicio'" key="inicio">
 <div class="hero" v-tilt v-par><span class="fl f1" aria-hidden="true">💬</span><span class="fl f2" aria-hidden="true">❤️</span><span class="fl f3" aria-hidden="true">📷</span><span class="fl f4" aria-hidden="true">🔐</span><span class="fl f5" aria-hidden="true">🛡️</span><div class="duo"><transition name="fb"><p class="bub hb" :class="'w'+sp.w" v-if="sp" :key="sp.k" aria-live="polite">{{sp.t}}</p></transition><button class="pb" :class="mood[0]" @click="poke(0)" aria-label="Búho">🦉</button><button class="pb run" :class="mood[1]" @click="poke(1)" aria-label="Pixel">🦊</button></div>
  <h2>Seis misiones para pensar mejor en internet</h2><p>Cada misión entrena una forma de pensar. Tú decides qué huella quieres dejar.</p>
  <svg class="trail" viewBox="0 0 800 200" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
   <path class="dash" d="M120 175 C230 90 300 170 400 120 S560 60 700 110"/>
   <g v-for="(f,i) in FP" :key="i" :transform="'translate('+f[0]+' '+f[1]+') rotate('+f[2]+')'"><g class="fp" :class="{last:i===4}" :style="{'--d':(.5+i*.4)+'s'}"><ellipse rx="11" ry="17"/><ellipse cy="26" rx="8" ry="9"/></g></g>
  </svg></div>
 <div class="strip"><div class="sc" style="--d:.1s"><b :key="nOn">{{nOn}}/{{BN.length}}</b><small>insignias</small></div><div class="sc" style="--d:.2s"><b>{{xpShow}}</b><small>XP · Nivel {{lvl+1}}</small></div><div class="sc" style="--d:.3s"><b :key="seen.length">{{seen.length}}/{{SECS.length}}</b><small>paradas visitadas</small></div></div>
 <div class="card think"><b>🏫 Tu escenario</b><p>En 6.º B el chat del curso se llena de memes burlones, premios falsos y fotos sin permiso. La rectoría pide al grupo crear un <b>Pacto de ciudadanos digitales</b>. En cada misión vas a ejercitar una forma de pensar para llegar a ese pacto.</p></div>
 <div class="card"><h3>Mapa de misiones</h3><p style="margin:0">Visita cada parada para completar el recorrido.</p><div class="map"><button v-for="(s,i) in SECS" :key="s[0]" class="stop" :class="{done:seen.includes(s[0]),here:sec===s[0]}" :style="{animationDelay:i*.12+'s'}" @click="go(s[0])"><i>{{seen.includes(s[0])?'✓':i+1}}</i>{{s[1]}}</button></div></div>
 <h3>Ruta de dificultad</h3>

const pick=j=>{if(s.value!==null)return;s.value=j;if(j===p.items[i.value][2])ok.value++};
